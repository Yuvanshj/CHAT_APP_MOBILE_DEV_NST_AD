name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APK Executable
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Chat App v1.0.0 - Standalone Android Executable (.apk)"
          body: |
            ## NST AD Mobile Application Evaluation Build
            - **Platform**: Android
            - **Build Type**: Standalone Release APK
            - **Architecture**: 100% Pure JavaScript (React Native + Expo)
            - **Capabilities**: Dual Real-time WebSockets (`ws://`) and HTTP REST Polling, Image Sharing, Camera, Groups, DMs.
            - **Verification**: All 24 unit & integration tests passing.
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
